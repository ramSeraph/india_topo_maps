name: Keep scheduled workflows active

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.repository == 'ramSeraph/india_topo_maps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          ref: main
      - name: Update and commit timestamp
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: update workflow keep-alive timestamp'
          git pull --rebase origin main
          git push origin HEAD:main
